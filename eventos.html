<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<style>
/* Bloqueia o modo escuro forçado dos navegadores (Brave/Safari iOS, Chrome
   Android): sem isto o motor reescreve as cores da marca e inverte fundos. */
:root { color-scheme: only light; }
html, body, img, svg, picture, video, canvas, iframe { color-scheme: only light; }
@media (prefers-color-scheme: dark) {
  :root, html, body { color-scheme: only light; forced-color-adjust: none; }
}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a sineira — estudos de eventos</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<style>
@font-face { font-family:"Courier Prime"; src:url("fonts/CourierPrime-400.woff2")  format("woff2"); font-weight:400; font-style:normal; font-display:swap; }
@font-face { font-family:"Courier Prime"; src:url("fonts/CourierPrime-700.woff2")  format("woff2"); font-weight:700; font-style:normal; font-display:swap; }

:root {
  --blue:  #003C78;
  --cream: #F2E7A9;
  --font:  "Courier Prime", "Courier New", monospace;
  --display: Helvetica, Arial, sans-serif;
  --bar: 56px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--cream); color: var(--blue); font-family: var(--font); }
a { color: inherit; text-decoration: none; }

.bar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 22px;
  height: var(--bar); padding: 0 30px;
  background: var(--cream); border-bottom: 1.5px solid var(--blue);
}
.mark {
  font-family: var(--display); font-size: 15px; font-weight: 700;
  letter-spacing: -.02em; text-transform: lowercase; white-space: nowrap;
}
.tabs { display: flex; gap: 18px; margin-left: auto; }
.tab {
  padding: 19px 0 17px; border: 0; background: none; color: inherit; cursor: pointer;
  font-family: var(--display); font-size: 10px; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase; white-space: nowrap;
  border-bottom: 2px solid transparent;
}
.tab:hover, .tab[aria-selected="true"] { border-bottom-color: var(--blue); }
.stage { height: calc(100vh - var(--bar)); }
.stage iframe { display: none; width: 100%; height: 100%; border: 0; background: var(--cream); }
.stage iframe.is-on { display: block; }

@media (max-width: 620px) {
  .bar { padding: 0 18px; gap: 12px; }
  .mark { font-size: 13px; }
}
</style>
</head>
<body>
<header class="bar">
  <a class="mark" href="index.html">a sineira · eventos</a>
  <nav class="tabs" role="tablist" aria-label="Estudos">
    <button class="tab" role="tab" id="tab-1" aria-controls="frame-1" aria-selected="true" data-hash="1">1 · experiências</button>
    <button class="tab" role="tab" id="tab-2" aria-controls="frame-2" aria-selected="false" data-hash="2">2 · telemóvel</button>
    <button class="tab" role="tab" id="tab-3" aria-controls="frame-3" aria-selected="false" data-hash="3">3 · o painel</button>
  </nav>
</header>
<div class="stage">
  <iframe class="is-on" id="frame-1" title="Estudo 1: cinco maneiras de mostrar os eventos" src="eventos1/index.html"></iframe>
  <iframe id="frame-2" title="Estudo 2: cartão e painel, primeiro no telemóvel" src="eventos2/index.html"></iframe>
  <iframe id="frame-3" title="Estudo 3: o painel que abre com o mais" src="eventos3/index.html"></iframe>
</div>
<script>
(function () {
  var tabs = document.querySelectorAll('.tab');
  var frames = {
    '1': document.getElementById('frame-1'),
    '2': document.getElementById('frame-2'),
    '3': document.getElementById('frame-3')
  };

  function show(id) {
    if (!frames[id]) id = '1';
    tabs.forEach(function (t) {
      var on = t.getAttribute('data-hash') === id;
      t.setAttribute('aria-selected', String(on));
    });
    Object.keys(frames).forEach(function (k) {
      frames[k].classList.toggle('is-on', k === id);
    });
    if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
  }

  tabs.forEach(function (t) {
    t.addEventListener('click', function () { show(t.getAttribute('data-hash')); });
  });
  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
  show(location.hash.slice(1) || '1');
})();
</script>
</body>
</html>
