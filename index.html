        width: 100%;
        height: 100%;
        margin: 0;
        text-align: center;

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background: #fff;
        color: #000;
        font-family: "Courier New", Courier, monospace;
      }

      h1 {
        font-weight: normal;
        font-size: 36pt;
        font-family: sans-serif;
        margin-top: 0;
        margin-bottom: -10px;
      }

      h2 {
        font-size: 10px;
        letter-spacing: 14px;
        font-family: sans-serif;
        position: fixed;
        bottom: 50px;
      }

      .svg {
        --letter-color: #000;
        width: 50%;
        min-width: 300px;
        display: block;
        margin: 60px auto 0 auto;
        z-index: 2;
        color: var(--letter-color);
      }

      .svg * {
        fill: var(--letter-color) !important;
      }

      @font-face {
        font-family: 'Favorit Light';
        src: url('Favorit-Light.ttf') format('truetype');
        font-weight: 300;
        font-style: normal;
        font-display: swap;
      }

      #bg-video {
position: relative;
    display: block;
    top: 150px;
    /* left: 50%; */
    max-height: 100vh;
    width: auto;
    max-width: 100vw;
    /* transform: translateY(-50%); */
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
      }

      .video-spacer {
        height: 100vh;
        width: 100%;
      }

      .content {
        position: relative;
        z-index: 2;
      }

      .content p {
        margin: 40px 0 40px;
        text-align: center;
        color: #000;
        font-family: 'Favorit Light', sans-serif;
        font-size: 18px;
      }
