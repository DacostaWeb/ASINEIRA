<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amigo da Sineira</title>

  <style>
    /* ==========================================================
       FONTE
       ========================================================== */
    @font-face {
      font-family: "Nimbus";
      src: url("fonts/NimbusSanL-Regu.ttf") format("truetype");
    }

    /* ==========================================================
       PALETA — apenas as duas cores universais do projeto.
       ========================================================== */
    :root {
      --blue:  #003C78; /* cor principal / fundo do banner / triângulo grande */
      --cream: #F2E7A9; /* cor secundária / texto do banner / fundo da página / detalhe do triângulo */
      --banner-height: 70px;
    }

    * {
      margin: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow-x: hidden;
      overflow-y: scroll;
      background: var(--cream);
      font-family: "Nimbus", serif;
    }

    /* ==========================================================
       TRIÂNGULO (logótipo SVG)
       ========================================================== */
    .triangle {
      position: fixed;
      left: 18px;
      bottom: calc(var(--banner-height) + 10px);
      width: 92px;
      z-index: 2;
    }

    .triangle svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .triangle .shape-blue  { fill: var(--blue); }
    .triangle .shape-cream { fill: var(--cream); }

    /* ==========================================================
       BANNER / MARQUEE (Apenas HTML + CSS)
       ========================================================== */
    .banner {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--banner-height);
      background: var(--blue);
      display: flex;
      align-items: center;
      overflow: hidden; 
    }

    .track {
      display: flex;
      width: max-content;
      animation: marquee 25s linear infinite; 
    }

    @media () {
      .track {
        animation: none;
        width: 100%;
        overflow: hidden;
      }
    }

    /* O texto principal */
    .marquee-text {
      white-space: nowrap;
      color: var(--cream);
      font-size: 20px;
      text-transform: uppercase;
      display: inline-flex;
    }

    /* 
       Duplicação automática via CSS:
       Usamos uma variável CSS contendo o texto para repeti-lo 
       múltiplas vezes e criar a largura necessária para o ecrã.
    */
    .marquee-text::before {
      content: var(--text) " \00a0\00a0\00a0\00a0 " var(--text) " \00a0\00a0\00a0\00a0 " var(--text) " \00a0\00a0\00a0\00a0 ";
    }

    /* 
       O clone exato do bloco acima para fazer o ponto de transição 
       invisível do loop (-50%)
    */
    .marquee-text::after {
      content: var(--text) " \00a0\00a0\00a0\00a0 " var(--text) " \00a0\00a0\00a0\00a0 " var(--text) " \00a0\00a0\00a0\00a0 ";
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); } 
    }
  </style>
</head>

<body>

  <!-- Triângulo / logótipo -->
  <div class="triangle">
    <svg viewBox="0 0 382 387" xmlns="http://w3.org">
      <g clip-path="url(#clip-triangle)">
        <path class="shape-blue"
              d="M95.7804 387L382 110.293L0 0L95.7804 387Z" />
        <path class="shape-cream"
              d="M237.388 200.34C247.689 213.363 261.205 214.741 278 206.656C294.744 198.596 298.733 188.514 293.636 177.859C287.97 166.014 278.519 164.239 250.934 170.39C207 180.098 190.348 170.391 180.948 150.741C168.813 125.373 179.487 99.0424 213.836 82.5088C252.358 63.9658 277.644 77.3509 289.904 97.6398L258.295 112.855C252.495 104.628 242.906 97.2765 224.201 106.28C211.468 112.409 206.307 121.384 211.25 131.717C216.092 141.839 224.216 142.977 250.269 137.146C297.241 126.807 314.026 138.102 323.842 158.622C336.554 185.197 325.231 213.078 286.876 231.541C250.048 249.268 221.95 240.417 205.779 215.554L237.388 200.34Z" />
        <path class="shape-cream"
              d="M127.809 268.327C123.481 279.019 118.021 294.985 117.576 297.957L87.9668 285.895C87.9997 283.319 89.7491 277.138 90.8443 274.28C84.2336 278.937 73.674 283.105 53.8757 275.039C26.8839 264.043 22.704 241.605 29.7557 224.188C40.1131 198.606 65.3714 195.148 98.1927 208.519L114.168 215.028L116.946 208.165C120.179 200.181 120.493 191.163 106.12 185.307C93.0352 179.976 87.9124 184.388 83.1947 191.939L53.7216 179.932C63.4814 160.661 82.3208 149.524 116.279 163.582C146.184 175.99 157.746 194.386 146.924 221.116L127.809 268.327ZM106.552 233.914L93.9249 228.77C75.2484 221.161 66.0077 224.06 61.6246 234.886C58.3332 243.015 60.5334 251.886 71.6733 256.424C91.3705 264.449 99.3509 251.7 105.357 236.865L106.552 233.914Z" />
      </g>
      <defs>
        <clipPath id="clip-triangle">
          <rect width="382" height="387" />
        </clipPath>
      </defs>
    </svg>
  </div>

  <!-- Banner animado (marquee) -->
  <div class="banner">
    <div class="track">
      <!-- Escreves a frase apenas uma vez no atributo style: --text -->
      <span class="marquee-text" style="--text: 'Adere já e torna-te um &quot;Amigo da Sineira&quot; para descontos e surpresas mensais!';"></span>
    </div>
  </div>

</body>
</html>
