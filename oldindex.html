        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;

        const rotation = Math.random() * 360;
        const vRotation = (Math.random() > 0.5 ? 1 : -1) * (1.5 + Math.random() * 2);

        const x = spawnX - size / 2;
        const y = spawnY - size / 2;

        svgEl.style.left = '0px';
        svgEl.style.top = '0px';
        svgEl.style.transform = `translate3d(${x}px, ${y}px, 0)`;

        document.body.appendChild(svgEl);

        const clipPath = svgEl.querySelector('path[id^="triangleClipPath_"]');
        const svgObj = {
          element: svgEl,
          triangle: triangleGroup,
          clip: clipPath,
          x: x,
          y: y,
          vx: vx,
          vy: vy,
          rotation: rotation,
          vRotation: vRotation,
          size: size
        };

        if (activeFlyingSvgs.length >= maxSvgs) {
          const oldest = activeFlyingSvgs.shift();
          if (oldest) {
            oldest.element.style.opacity = '0';
            oldest.element.style.transition = 'opacity 0.2s ease';
            setTimeout(() => {
              oldest.element.remove();
            }, 200);
          }
        }

        activeFlyingSvgs.push(svgObj);

        svgEl.addEventListener('pointerenter', (event) => {
          event.stopPropagation();

          const rect = svgEl.getBoundingClientRect();
          const dx = (rect.left + rect.width / 2) - event.clientX;
          const dy = (rect.top + rect.height / 2) - event.clientY;
          const awayAngle = Math.atan2(dy, dx);
          const repelSpeed = 4 + Math.random() * 4;

          svgObj.vx = Math.cos(awayAngle) * repelSpeed;
          svgObj.vy = Math.sin(awayAngle) * repelSpeed;
          svgObj.vRotation = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2);
        });

        if (activeFlyingSvgs.length === 1) {
          requestAnimationFrame(updatePhysics);
        }
      }

      function updatePhysics() {
        if (activeFlyingSvgs.length === 0) return;

        const w = window.innerWidth;
        const h = window.innerHeight;

        for (let i = activeFlyingSvgs.length - 1; i >= 0; i--) {
          const s = activeFlyingSvgs[i];

          s.x += s.vx;
          s.y += s.vy;
          s.rotation += s.vRotation;

          if (s.x < 0) {
            s.x = 0;
            s.vx = -s.vx;
          } else if (s.x + s.size > w) {
            s.x = w - s.size;
            s.vx = -s.vx;
          }

          if (s.y < 0) {
            s.y = 0;
            s.vy = -s.vy;
          } else if (s.y + s.size > h) {
            s.y = h - s.size;
            s.vy = -s.vy;
          }

          s.element.style.transform = `translate3d(${s.x}px, ${s.y}px, 0)`;
          if (s.triangle) {
            s.triangle.setAttribute('transform', `rotate(${s.rotation} ${triangleRotationOrigin.x} ${triangleRotationOrigin.y})`);
          }
          if (s.clip) {
            s.clip.setAttribute('transform', `rotate(${s.rotation} ${triangleRotationOrigin.x} ${triangleRotationOrigin.y})`);
          }
        }

        requestAnimationFrame(updatePhysics);
      }

      function onTouchStart(e) {
        touchStartTime = Date.now();
        touchActive = true;
        lastTouchPoint = e.touches[0];
      }

      function onTouchMove(e) {
        if (!touchActive) return;
        if (e.touches && e.touches[0]) {
          lastTouchPoint = e.touches[0];
        }
      }

      function onTouchEnd(e) {
        if (!touchActive) return;
        touchActive = false;
        const duration = Date.now() - (touchStartTime || Date.now());
        touchStartTime = null;
        const point = e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : lastTouchPoint;
        spawnFlyingSvg(point, duration);
      }

      mainSvg.addEventListener('mouseenter', spawnFlyingSvg);
      mainSvg.addEventListener('touchstart', onTouchStart, { passive: true });
      mainSvg.addEventListener('touchmove', onTouchMove, { passive: true });
      document.addEventListener('touchend', onTouchEnd, { passive: true });
      document.addEventListener('touchcancel', onTouchEnd, { passive: true });

      // Ensure video is muted and plays inline on iOS; try to autoplay programmatically.
      const bgVideo = document.getElementById('bg-video');
      if (bgVideo) {
        bgVideo.muted = true;
        bgVideo.playsInline = true;
        bgVideo.setAttribute('playsinline', '');
        bgVideo.setAttribute('webkit-playsinline', '');

        const tryPlay = () => {
          const p = bgVideo.play();
          if (p && p.catch) p.catch(() => {});
        };

        // Attempt autoplay once on load
        tryPlay();

        // Create mute/unmute toggle button
        const btn = document.createElement('button');
        btn.className = 'video-toggle';
        btn.type = 'button';
        btn.title = 'Unmute / Mute video';
        btn.setAttribute('aria-pressed', 'false');
        const svgMuted = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M11 5 L7 9 H3 v6 h4 l4 4 V5 z" fill="#F2E7A9"/><line x1="19" y1="5" x2="5" y2="21" stroke="#F2E7A9" stroke-width="2" stroke-linecap="round"/></svg>';
        const svgUnmuted = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M11 5 L7 9 H3 v6 h4 l4 4 V5 z" fill="#F2E7A9"/><path d="M16.5 8.5a5 5 0 010 7" stroke="#F2E7A9" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M19 6a8 8 0 010 12" stroke="#F2E7A9" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
        btn.innerHTML = svgMuted;
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          if (bgVideo.muted) {
            bgVideo.muted = false;
            btn.innerHTML = svgUnmuted;
            bgVideo.play().catch(() => {});
            btn.setAttribute('aria-pressed', 'true');
          } else {
            bgVideo.muted = true;
            btn.innerHTML = svgMuted;
            btn.setAttribute('aria-pressed', 'false');
          }
        });
        document.body.appendChild(btn);
      }
    })();
  </script>
</body>
</html>
